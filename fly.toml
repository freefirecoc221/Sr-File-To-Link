app = "apnar-app-er-nam"  # এখানে আপনার Fly.io অ্যাপের নামটি বসাবেন
primary_region = "iad"    # আপনার পছন্দমতো রিজিওন কোড দিতে পারেন

[build]
  dockerfile = "Dockerfile"

[http_services]
  internal_port = 8080   # আপনার কোড যে পোর্টে রান করছে (যেমন 8080 বা 7860)
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
